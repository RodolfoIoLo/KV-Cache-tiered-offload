<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">一层 Encoder Attention：张量怎样变化</title><desc id="desc">原创张量形状示意图，展示Transformer-big在批大小32、长度128、16个头、每头64维时的注意力矩阵运算。QKV是激活结果，WQWK和WV是权重。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#53657b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e8edf3"/><path d="M0 8 L8 0" stroke="#c3cdd9" stroke-width="1"/></pattern></defs>
<rect width="1200" height="900" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#172b45">
<text x="40" y="47" font-size="29" fill="#172b45" text-anchor="start" font-weight="700">一层 Encoder Attention：张量怎样变化</text>
<text x="40" y="82" font-size="19" fill="#53657b" text-anchor="start" font-weight="400">B = 32，S = 128，d_model = 1024，h = 16，d_head = 64；以下形状是逻辑布局。</text>
<rect x="350" y="110" width="500" height="66" rx="12" fill="#f3f7fd" stroke="#c7d4e5" stroke-width="1.5"/>
<text x="600.0" y="150.0" font-size="20" fill="#172b45" text-anchor="middle" font-weight="600">输入激活 X：[32, 128, 1024]</text>
<polyline points="600,176 600,208" fill="none" stroke="#53657b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="160" y="208" width="880" height="75" rx="12" fill="#f3f7fd" stroke="#c7d4e5" stroke-width="1.5"/>
<text x="600.0" y="238.0" font-size="20" fill="#172b45" text-anchor="middle" font-weight="600">Q = XWQ，K = XWK，V = XWV</text>
<text x="600.0" y="267.0" font-size="20" fill="#172b45" text-anchor="middle" font-weight="400">WQ、WK、WV 各为 [1024, 1024]；Q、K、V 各为 [32, 128, 1024]</text>
<polyline points="600,283 600,315" fill="none" stroke="#53657b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="160" y="315" width="880" height="75" rx="12" fill="#eaf7f4" stroke="#a3d6c9" stroke-width="1.5"/>
<text x="600.0" y="344.85" font-size="21" fill="#172b45" text-anchor="middle" font-weight="600">拆分 head 维度，再调整维度顺序</text>
<text x="600.0" y="374.85" font-size="21" fill="#172b45" text-anchor="middle" font-weight="400">[32, 128, 16, 64] → [32, 16, 128, 64]</text>
<polyline points="410,390 410,424" fill="none" stroke="#53657b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="60" y="424" width="700" height="78" rx="12" fill="#f3f7fd" stroke="#c7d4e5" stroke-width="1.5"/>
<text x="410.0" y="455.8" font-size="18" fill="#172b45" text-anchor="middle" font-weight="600">QKᵀ：每个 Query 与同头的全部 Key 点积</text>
<text x="410.0" y="482.8" font-size="18" fill="#172b45" text-anchor="middle" font-weight="400">[32,16,128,64] × [32,16,64,128] → [32,16,128,128]</text>
<text x="810" y="440" font-size="20" fill="#0f8b8d" text-anchor="start" font-weight="400">V 保留为</text>
<text x="810" y="473" font-size="21" fill="#0f8b8d" text-anchor="start" font-weight="600">[32,16,128,64]</text>
<polyline points="410,502 410,535" fill="none" stroke="#53657b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="60" y="535" width="700" height="85" rx="12" fill="#fff7ed" stroke="#efbb7d" stroke-width="1.5"/>
<text x="410.0" y="556.8" font-size="18" fill="#172b45" text-anchor="middle" font-weight="600">分数 ÷ √64，再加 padding mask</text>
<text x="410.0" y="583.8" font-size="18" fill="#172b45" text-anchor="middle" font-weight="400">沿最后一维 softmax：每个 Query 对可见 Key 的权重 A</text>
<text x="410.0" y="610.8" font-size="18" fill="#172b45" text-anchor="middle" font-weight="400">A：[32, 16, 128, 128]</text>
<polyline points="410,620 410,653" fill="none" stroke="#53657b" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="955,490 955,688 790,688" fill="none" stroke="#53657b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="60" y="653" width="730" height="77" rx="12" fill="#f3f7fd" stroke="#c7d4e5" stroke-width="1.5"/>
<text x="425.0" y="684.15" font-size="19" fill="#172b45" text-anchor="middle" font-weight="600">AV：按权重汇总 Value</text>
<text x="425.0" y="712.15" font-size="19" fill="#172b45" text-anchor="middle" font-weight="400">[32,16,128,128] × [32,16,128,64] → [32,16,128,64]</text>
<polyline points="410,730 410,760" fill="none" stroke="#53657b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="60" y="760" width="1080" height="75" rx="12" fill="#eaf7f4" stroke="#a3d6c9" stroke-width="1.5"/>
<text x="600.0" y="789.85" font-size="21" fill="#172b45" text-anchor="middle" font-weight="600">合并 16 个头，再乘输出权重 WO：[1024, 1024]</text>
<text x="600.0" y="819.85" font-size="21" fill="#172b45" text-anchor="middle" font-weight="400">[32,16,128,64] → [32,128,1024] → [32,128,1024]</text>
<text x="60" y="875" font-size="18" fill="#53657b" text-anchor="start" font-weight="400">Q、K、V 是本次输入产生的激活；WQ、WK、WV、WO 才是训练得到并跨请求复用的参数。</text>
</g></svg>
